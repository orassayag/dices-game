services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dices_game
      POSTGRES_PASSWORD: dices_game
      POSTGRES_DB: dices_game
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dices_game']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
